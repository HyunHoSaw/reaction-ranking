- name: 온프레미스 서버에 반응속도 랭킹 앱 배포
  hosts: onprem
  become: true
  vars:
    app_dir: /opt/reaction-ranking      # 서버에 앱을 둘 위치 (변수로 한 곳에서 관리)

  tasks:
    - name: 앱 폴더 만들기
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: 코드 복사 (frontend, backend 폴더)
      ansible.builtin.copy:
        src: "../{{ item }}"            # 맥북 쪽 경로 (플레이북 기준)
        dest: "{{ app_dir }}/"          # Rocky 쪽 경로
        mode: preserve
      loop: [frontend, backend]

    - name: docker-compose.yml 복사
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    - name: 컨테이너 빌드 + 실행
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"          # 이 폴더에서 실행 (cd 하는 것과 같음)
      register: compose
      changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr"

    - name: 서비스가 응답할 때까지 기다리기 (최대 60초)
      ansible.builtin.uri:
        url: http://localhost:8080/api/health
        status_code: 200
      register: health
      retries: 12                       # 12번까지
      delay: 5                          # 5초 간격으로 다시 시도
      until: health.status == 200

    - name: 결과 출력
      ansible.builtin.debug:
        msg: "배포 완료! 상태: {{ health.json.status }}"

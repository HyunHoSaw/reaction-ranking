apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reaction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 276947488185.dkr.ecr.ap-northeast-2.amazonaws.com/reaction-frontend:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reaction
spec:
  type: LoadBalancer      # AWS에 로드밸런서를 만들어달라고 요청
  selector:
    app: frontend
  ports:
    - port: 80
